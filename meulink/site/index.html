*{box-sizing:border-box;margin:0;padding:0}

/* ---------- PÁGINA PÚBLICA ---------- */
body.pub{color:#fff;background:#0f1a0f;min-height:100vh;display:flex;justify-content:center}
.bg{position:fixed;inset:0;z-index:0;background:linear-gradient(160deg,#1f3a1f,#0b120b);background-size:cover;background-position:center}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.05) 40%,rgba(0,0,0,.55))}
.pubmain{position:relative;z-index:1;width:100%;max-width:480px;padding:56px 20px 40px;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:100vh;min-height:100dvh}
.pubmain .blocolinks{width:100%;display:flex;flex-direction:column;align-items:center}
.pubmain.pos-meio .blocolinks{margin-top:22vh;margin-top:22dvh}
.pubmain.pos-baixo .blocolinks{margin-top:auto}
.avatar{width:104px;height:104px;border-radius:50%;border:4px solid #111;object-fit:cover;background:#2a4a2a;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.pubmain h1{font-size:28px;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.5);text-align:center}

.links{width:100%;display:flex;flex-direction:column;gap:12px}

.icon{width:52px;height:52px;border-radius:12px;flex-shrink:0;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px}
.ctxt{flex:1;min-width:0}
.ctitle{font-size:17px;font-weight:600}

/* ---------- PAINÉIS ---------- */

.telbox{display:flex;align-items:stretch;border:1px solid #d1d5db;border-radius:10px;overflow:hidden;background:#fff}

.sticky{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(243,244,246,.95);border-top:1px solid #e5e7eb}

<body>
<div id="app"></div>

<script>
/* =====================================================================
   PLATAFORMA DE LINK NA BIO
   Rotas:  /            página inicial
           /admin       painel do cliente
           /master      seu painel
           /termos      termos de uso
           /qualquer    página pública do cliente
   ===================================================================== */
const CFG = window.APP_CONFIG || {};
const app = document.getElementById("app");
const PLATAFORMA = CFG.NOME_PLATAFORMA || "MeuLink";
const RESERVADOS = ["admin","master","termos","login","api","assets","www"];
let sb = null;

/* ---------- utilidades ---------- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs || {})){
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()){
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
function limpar(cls){ document.body.className = cls; app.innerHTML = ""; }
function toast(t){
  const el = h("div",{class:"toast",text:t});
  document.body.append(el);
  setTimeout(()=>el.remove(), 2600);
}
function safeUrl(u){
  try{
    const x = new URL(u);
    return ["http:","https:","mailto:","tel:"].includes(x.protocol) ? x.toString() : "#";
  }catch{ return "#"; }
}
function normalizarUrl(u){
  u = (u || "").trim();
  if (!u) return "";
  if (!/^(https?:|mailto:|tel:)/i.test(u)) u = "https://" + u;
  // tira lixo de rastreio colado junto (fbclid, utm_…, igsh) para não "grudar" no link salvo
  try{
    const x = new URL(u);
    if (/^https?:$/.test(x.protocol)){
      [...x.searchParams.keys()].forEach(k=>{ if (/^(fbclid|gclid|igsh|igshid|utm_.+)$/i.test(k)) x.searchParams.delete(k); });
      return x.toString();
    }
  }catch{}
  return u;
}
/* origem do tráfego: ?utm_source=… ou, sem isso, o site de onde a pessoa veio */
function origemVisita(params){
  const utm = (params.get("utm_source") || "").trim().toLowerCase();
  if (utm) return utm.slice(0,40);
  const ua = navigator.userAgent || "";
  if (/Instagram/i.test(ua)) return "instagram";
  if (/FBAN|FBAV|FB_IAB/i.test(ua)) return "facebook";
  if (/musical_ly|TikTok|BytedanceWebview/i.test(ua)) return "tiktok";
  let ref = ""; try{ ref = document.referrer ? new URL(document.referrer).hostname.replace(/^www\./,"") : ""; }catch{}
  if (!ref || ref === location.hostname) return null;
  const mapa = [["instagram","instagram"],["facebook","facebook"],["fb.","facebook"],["tiktok","tiktok"],["whatsapp","whatsapp"],["wa.me","whatsapp"],
                ["youtube","youtube"],["youtu.be","youtube"],["t.co","twitter"],["twitter","twitter"],["x.com","twitter"],["google","google"],["t.me","telegram"],["telegram","telegram"],["kwai","kwai"]];
  const m = mapa.find(([k])=>ref.includes(k));
  return m ? m[1] : ref.slice(0,40);
}
function apiPost(tabela, corpo){
  try{
    fetch(`${CFG.SUPABASE_URL}/rest/v1/${tabela}`, {
      method:"POST", keepalive:true,
      headers: Object.assign(
        { apikey:CFG.SUPABASE_ANON_KEY, "Content-Type":"application/json", Prefer:"return=minimal" },
        CFG.SUPABASE_ANON_KEY.startsWith("eyJ") ? { Authorization:"Bearer " + CFG.SUPABASE_ANON_KEY } : {}
      ),
      body:JSON.stringify(corpo)
    }).catch(()=>{});
  }catch{}
}
function normalizarSlug(s){
  return (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9-]/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"").slice(0,30);
}
function slugValido(s){ return /^[a-z0-9][a-z0-9-]{1,29}$/.test(s) && !RESERVADOS.includes(s); }
function mascaraTel(v){
  const d = (v || "").replace(/\D/g,"").slice(0,11);
  if (d.length <= 2) return d ? "(" + d : "";
  if (d.length <= 6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if (d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
}
function telValido(v){ const d = (v||"").replace(/\D/g,""); return d.length === 10 || d.length === 11; }
function normalizarInsta(v){
  v = (v || "").trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i,"").replace(/[\/?#].*$/,"").replace(/^@+/,"");
  return v.toLowerCase();
}
function instaValido(v){ return /^[a-z0-9._]{1,30}$/.test(v); }
function campoTel(valor){
  const el = h("input",{type:"tel",inputmode:"numeric",autocomplete:"tel-national",placeholder:"(71) 99999-9999",value:mascaraTel(valor)});
  el.addEventListener("input",()=>{
    let d = el.value.replace(/\D/g,"");
    if (d.length > 11 && d.startsWith("55")) d = d.slice(2);   // colou com +55 / 55
    el.value = mascaraTel(d);
  });
  const caixa = h("div",{class:"telbox"}, h("span",{class:"ddi",text:"🇧🇷 +55"}), el);
  // permite ler o valor direto da caixa (inTel.value / tel.value)
  Object.defineProperty(caixa, "value", { get:()=>el.value, set:(v)=>{ el.value = mascaraTel(v); } });
  return caixa;
}
function campoInsta(valor){
  const el = h("input",{type:"text",autocapitalize:"none",autocorrect:"off",placeholder:"@seuinstagram",value:valor ? "@"+valor : ""});
  el.addEventListener("blur",()=>{ const n = normalizarInsta(el.value); el.value = n ? "@"+n : ""; });
  return el;
}
function dominioDe(u){ try{ return new URL(u).hostname.replace(/^www\./,""); }catch{ return u; } }
function suspeitoAposta(u){
  const d = dominioDe(u).toLowerCase();
  return /bet|cassino|casino|slot|tigr|aposta|pix.?game/.test(d) && !d.endsWith(".bet.br");
}
/* aviso de jogo responsável (+18) e selo de casas autorizadas */
function blocoAvisos(links, escuro){
  const temIrregular = (links || []).some(l=>suspeitoAposta(l.url || ""));
  const cor = escuro ? "rgba(255,255,255,.85)" : "#4b5563";
  const borda = escuro ? "rgba(255,255,255,.25)" : "#d1d5db";
  return h("div",{class:"avisos",style:`color:${cor};border-color:${borda}`},
    h("div",{class:"av18"},
      h("span",{class:"selo18",style:`border-color:${cor}`,text:"18+"}),
      h("span",{text:"Proibido para menores de 18 anos. Jogue com responsabilidade: apostas envolvem risco de perda e não são forma de renda."})
    ),
    temIrregular ? null : h("div",{class:"avselo"},
      h("span",{text:"✔"}),
      h("span",{text:"Divulgamos apenas casas de apostas autorizadas pelo Ministério da Fazenda."})
    )
  );
}
function linkWhatsAdmin(texto){
  const n = (CFG.WHATSAPP_CONTATO || "").replace(/\D/g,"");
  return n ? `https://wa.me/${n}${texto ? "?text=" + encodeURIComponent(texto) : ""}` : null;
}
function dataBR(d){ return new Date(d).toLocaleDateString("pt-BR"); }
function svgSeta(){
  const s = document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("width","14"); s.setAttribute("height","14"); s.setAttribute("viewBox","0 0 24 24");
  s.innerHTML = '<path d="M7 17L17 7M9 7h8v8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>';
  return s;
}
function traduzErro(e){
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/Invalid login credentials/i.test(m)) return "E-mail ou senha incorretos.";
  if (/Email not confirmed/i.test(m)) return "Confirme seu e-mail antes de entrar (veja sua caixa de entrada e o spam).";
  if (/already registered/i.test(m)) return "Esse e-mail já tem conta. Use a aba Entrar.";
  if (/Password should be at least|weak.?password/i.test(m)) return "A senha precisa ter pelo menos 6 caracteres.";
  if (/duplicate key|profiles_slug_key/i.test(m)) return "Esse endereço já está em uso. Escolha outro.";
  if (/rate limit/i.test(m)) return "Muitas tentativas. Espere alguns minutos e tente de novo.";
  return m;
}

/* ---------- imagens: reduz e converte p/ JPG (resolve HEIC do iPhone) ---------- */
function carregarImg(src){
  return new Promise((ok, falha)=>{ const i = new Image(); i.onload=()=>ok(i); i.onerror=falha; i.src=src; });
}
async function prepararImagem(file, max){
  const url = URL.createObjectURL(file);
  try{
    const img = await carregarImg(url);
    const esc = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * esc); c.height = Math.round(img.height * esc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
  } finally { URL.revokeObjectURL(url); }
}
async function enviarImagem(uid, tipo, file){
  const blob = await prepararImagem(file, tipo === "fundo" ? 1600 : 600);
  if (!blob) throw new Error("Não consegui ler essa imagem. Tente outra foto.");
  const caminho = `${uid}/${tipo}-${Date.now()}.jpg`;
  const { error } = await sb.storage.from("midia").upload(caminho, blob, { contentType:"image/jpeg", upsert:true });
  if (error) throw error;
  return sb.storage.from("midia").getPublicUrl(caminho).data.publicUrl;
}

/* =====================================================================
   PÁGINA PÚBLICA
   ===================================================================== */
async function paginaPublica(slug){
  const { data, error } = await sb.from("profiles")
    .select("id,slug,nome,bio,avatar_url,fundo_url,cor,links,ativo,aviso_apostas,posicao_links")
    .eq("slug", slug).maybeSingle();
  if (error || !data || !data.ativo) return naoEncontrada();

  limpar("pub");
  document.title = data.nome || data.slug;
  const entrada = new URLSearchParams(location.search);
  const origem = origemVisita(entrada);
  apiPost("visitas", { profile_id:data.id, utm_source:origem });
  const repassar = (url)=>{
    try{
      const u = new URL(url);
      if (!/^https?:$/.test(u.protocol)) return url;
      for (const [k,v] of entrada)
        if ((k.startsWith("utm_") || k === "fbclid") && !u.searchParams.has(k)) u.searchParams.set(k, v);
      return u.toString();
    }catch{ return url; }
  };

  const bg = h("div",{class:"bg"});
  if (data.fundo_url){
    carregarImg(data.fundo_url).then(()=>{ bg.style.backgroundImage = `url("${data.fundo_url}")`; }).catch(()=>{});
  }
  const lista = h("div",{class:"links"});
  (Array.isArray(data.links) ? data.links : []).forEach((l, i)=>{
    const url = safeUrl(l.url);
    if (url === "#") return;
    const destino = repassar(url);
    lista.append(h("a",{
        class:"card", href:destino, rel:"noopener",
        style:`background:${/^#[0-9a-fA-F]{6}$/.test(data.cor) ? data.cor : "#344e1c"}ee`,
        onclick:()=>registrarClique(data.id, i, url, origem)
      },
      (l.icone && safeUrl(l.icone) !== "#")
        ? h("img",{class:"icon",src:l.icone,alt:"",style:"object-fit:cover"})
        : h("div",{class:"icon",text:(l.titulo||"?").trim().charAt(0).toUpperCase()}),
      h("div",{class:"ctxt"},
        h("div",{class:"ctitle",text:l.titulo || "Link"}),
        h("div",{class:"csub",text:url.replace(/^https?:\/\//,"")})
      ),
      h("div",{class:"arrow"}, svgSeta())
    ));
  });

  const av = data.avatar_url ? h("img",{class:"avatar",alt:data.nome || "",src:data.avatar_url}) : null;

  const pos = ["alto","meio","baixo"].includes(data.posicao_links) ? data.posicao_links : "alto";
  app.append(bg, h("main",{class:"pubmain pos-" + pos},
    av,
    h("h1",{text:data.nome || ""}),
    data.bio ? h("p",{class:"pubbio",text:data.bio}) : null,
    h("div",{class:"blocolinks"},
      lista,
      data.aviso_apostas === false ? null : blocoAvisos(data.links, true)
    )
  ));
}

function registrarClique(profileId, idx, url, utm){
  apiPost("cliques", { profile_id:profileId, link_idx:idx, url, utm_source:utm || null });
}

function naoEncontrada(){
  limpar("painel");
  document.title = "Página não encontrada";
  document.head.append(h("meta",{name:"robots",content:"noindex"}));

function telaLogin(destino){
  limpar("painel");
  document.title = "Entrar — " + PLATAFORMA;
  let modo = "entrar";
  const msg = h("div");
  const form = h("div");
  const tabE = h("button",{text:"Entrar",onclick:()=>{modo="entrar";desenhar();}});
  const tabC = h("button",{text:"Criar conta",onclick:()=>{modo="criar";desenhar();}});

  function aviso(t, tipo){ msg.innerHTML=""; if(t) msg.append(h("div",{class:"msg "+(tipo||"erro"),text:t})); }

  function desenhar(){
    tabE.className = modo==="entrar" ? "on" : "";
    tabC.className = modo==="criar" ? "on" : "";
    form.innerHTML = ""; aviso("");
    if (modo === "entrar") desenharEntrar(); else desenharCriar();
  }

  function desenharEntrar(){
    const email = h("input",{type:"email",autocomplete:"email",placeholder:"seu@email.com"});
    const senha = h("input",{type:"password",autocomplete:"current-password",placeholder:"Sua senha"});
    const bt = h("button",{class:"btn full",text:"Entrar",style:"margin-top:14px",onclick:async()=>{
      bt.disabled = true; aviso("");
      const { error } = await sb.auth.signInWithPassword({ email:email.value.trim(), password:senha.value });
      bt.disabled = false;
      if (error) return aviso(traduzErro(error));
      destino();
    }});
    const esqueci = h("button",{class:"btn sec full",text:"Esqueci a senha",style:"margin-top:8px",onclick:async()=>{
      if (!email.value.trim()) return aviso("Digite seu e-mail acima primeiro.");
      const { error } = await sb.auth.resetPasswordForEmail(email.value.trim(), { redirectTo: location.origin + "/admin" });
      aviso(error ? traduzErro(error) : "Enviamos um link para redefinir a senha. Veja seu e-mail (e o spam).", error ? "erro" : "ok");
    }});
    form.append(h("label",{text:"E-mail"}), email, h("label",{text:"Senha"}), senha, bt, esqueci);
  }

  function desenharCriar(){
    const nome = h("input",{type:"text",placeholder:"Como vai aparecer na página"});
    const slug = h("input",{type:"text",placeholder:"ex: joaosilva",autocapitalize:"none"});
    const prevSlug = h("div",{class:"hint"});
    const insta = campoInsta("");
    const tel = campoTel("");
    const email = h("input",{type:"email",autocomplete:"email",placeholder:"seu@email.com"});
    const senha = h("input",{type:"password",autocomplete:"new-password",placeholder:"Mínimo 6 caracteres"});
    const termos = h("input",{type:"checkbox"});
    const atualizarPrev = ()=>{
      const s = normalizarSlug(slug.value);
      prevSlug.textContent = s ? `Sua página: ${location.host}/${s}` : "Só letras minúsculas, números e hífen.";
    };
    nome.addEventListener("input",()=>{ if(!slug.dataset.mexeu){ slug.value = normalizarSlug(nome.value); atualizarPrev(); } });
    slug.addEventListener("input",()=>{ slug.dataset.mexeu = "1"; atualizarPrev(); });
    atualizarPrev();

    const bt = h("button",{class:"btn full",text:"Criar minha página",style:"margin-top:14px",onclick:async()=>{
      aviso("");
      const s = normalizarSlug(slug.value);
      if (!nome.value.trim()) return aviso("Preencha o nome.");
      if (!slugValido(s)) return aviso("Endereço inválido. Use de 2 a 30 caracteres: letras minúsculas, números e hífen.");
      const ig = normalizarInsta(insta.value);
      if (!instaValido(ig)) return aviso("Informe o @ do Instagram (ex: @seuinstagram).");
      if (!telValido(tel.value)) return aviso("Informe o telefone com DDD, ex: (71) 99999-9999.");
      if (!termos.checked) return aviso("Você precisa aceitar os termos de uso.");
      bt.disabled = true;
      const { data:livre, error:e1 } = await sb.rpc("slug_disponivel", { s });
      if (e1){ bt.disabled=false; return aviso(traduzErro(e1)); }
      if (!livre){ bt.disabled=false; return aviso("Esse endereço já está em uso. Escolha outro."); }
      const { data, error } = await sb.auth.signUp({
        email: email.value.trim(), password: senha.value,
        options:{ data:{ slug:s, nome:nome.value.trim(), instagram:ig, telefone:mascaraTel(tel.value) }, emailRedirectTo: location.origin + "/admin" }
      });
      bt.disabled = false;
      if (error) return aviso(traduzErro(error));
      if (data.session) return destino();
      form.innerHTML = "";
      aviso("Conta criada! Enviamos um e-mail de confirmação. Toque no link do e-mail e depois entre aqui com seu e-mail e senha.", "ok");
    }});
    form.append(
      h("label",{text:"Nome"}), nome,
      h("label",{text:"Endereço da página"}), slug, prevSlug,
      h("label",{text:"Instagram"}), insta,
      h("label",{text:"Telefone / WhatsApp com DDD"}), tel,
      h("label",{text:"E-mail"}), email,
      h("label",{text:"Senha"}), senha,
      h("label",{class:"check"}, termos, h("span",{}, "Li e aceito os ", h("a",{href:"/termos",target:"_blank",text:"termos de uso"}), ". Sou responsável pelo conteúdo e pelos links da minha página.")),
      bt
    );
  }

  app.append(h("div",{class:"wrap"},
    h("div",{class:"top"}, h("h2",{text:PLATAFORMA})),
    h("div",{class:"box"}, h("div",{class:"tabs"}, tabE, tabC), form, msg)
  ));
  desenhar();
}

const COLS_PUBLICAS = "id,slug,nome,bio,avatar_url,fundo_url,cor,links,ativo,aviso_apostas,posicao_links,created_at";
async function comPrivado(perfil){
  if (!perfil) return perfil;
  const { data } = await sb.rpc("meu_privado");
  const pv = Array.isArray(data) ? data[0] : data;
  return Object.assign(perfil, { instagram:pv?.instagram || null, telefone:pv?.telefone || null, is_master:!!pv?.is_master });
}
async function meuPerfil(user){
  const { data, error } = await sb.from("profiles").select(COLS_PUBLICAS).eq("id", user.id).maybeSingle();
  if (error) throw error;
  if (data) return comPrivado(data);
  // primeiro acesso: cria o perfil com o que foi escolhido no cadastro
  const md = user.user_metadata || {};
  const novo = { id:user.id, slug:md.slug, nome:md.nome || "", instagram:md.instagram || null, telefone:md.telefone || null, termos_aceitos_em:new Date().toISOString() };
  if (!slugValido(novo.slug || "")) return null;
  const { error:e2 } = await sb.from("profiles").insert(novo);
  if (e2){
    if (/duplicate|slug/i.test(e2.message)) return null;
    throw e2;
  }
  const { data:criado } = await sb.from("profiles").select(COLS_PUBLICAS).eq("id", user.id).single();
  return comPrivado(criado);
}

}

async function carregarStats(uid, box){
  const { data:st, error } = await sb.rpc("stats_perfil", { p_id:uid, p_dias:30 });
  box.lastChild.remove();
  if (error || !st) return box.append(h("p",{class:"hint",text:"Não foi possível carregar."}));
  desenharStats(box, st, { links:true });
}
function pct(a, b){ return b ? Math.round(a * 100 / b) + "%" : "—"; }
function desenharStats(box, st, op){
  const kpi = (v, t)=>h("div",{class:"kpi",style:"background:#f9fafb"}, h("b",{text:String(v)}), h("span",{text:t}));
  box.append(h("div",{class:"kpis"},
    kpi(st.visitas, "visitas"), kpi(st.cliques, "cliques"), kpi(pct(st.cliques, st.visitas), "clicaram"),
    kpi(st.visitas_hoje + " / " + st.cliques_hoje, "hoje (vis./cliq.)")
  ));
  if (!st.visitas && !st.cliques) return box.append(h("p",{class:"hint",text:"Nada ainda. Coloque o link na bio e volte aqui."}));
  const dias = st.por_dia || [];
  const max = Math.max(1, ...dias.map(d=>Math.max(d.visitas, d.cliques)));
  box.append(h("label",{text:"Últimos 14 dias"}),
    h("div",{style:"display:flex;align-items:flex-end;gap:3px;height:70px;margin:4px 0 2px"},
      dias.map(d=>h("div",{title:`${d.dia.split("-").reverse().slice(0,2).join("/")}: ${d.visitas} visitas, ${d.cliques} cliques`,
        style:"flex:1;display:flex;align-items:flex-end;gap:1px;height:100%"},
        h("div",{style:`flex:1;background:#9ca3af;border-radius:3px 3px 0 0;height:${Math.max(2, d.visitas*100/max)}%`}),
        h("div",{style:`flex:1;background:#16a34a;border-radius:3px 3px 0 0;height:${Math.max(2, d.cliques*100/max)}%`})))),
    h("p",{class:"hint",text:"Cinza: visitas · Verde: cliques"}));
  if (op && op.links && st.por_link.length){
    box.append(h("label",{text:"Cliques por botão"}));
    st.por_link.forEach(l=>box.append(h("div",{class:"stat"}, h("span",{text:(l.url||"").replace(/^https?:\/\//,"")}), h("b",{text:String(l.n)}))));
  }
  if (st.por_origem.length){
    box.append(h("label",{text:"De onde vieram"}));
    st.por_origem.forEach(o=>box.append(h("div",{class:"stat"},
      h("span",{text:o.origem}), h("b",{text:`${o.visitas} vis. · ${o.cliques} cliq.`}))));
  }
  box.append(h("p",{class:"hint",style:"margin-top:8px",text:"Dica: no story, use o link com ?utm_source=story (ex: " + location.host + "/seunome?utm_source=story) para saber o que veio de cada lugar. Visitas começaram a ser contadas em 26/11/2026."}));
}

/* =====================================================================
   PAINEL MASTER  (/master)
   ===================================================================== */
async function painelMaster(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return telaLogin(painelMaster);
  const { data:souMaster } = await sb.rpc("is_master");
  if (!souMaster) return erroGeral("Acesso restrito ao administrador.");

  limpar("painel");
  document.title = "Master — " + PLATAFORMA;
  const busca = h("input",{type:"search",placeholder:"Buscar por nome, endereço ou e-mail"});
  const lista = h("div");
  const kpis = h("div",{class:"kpis"});
  let todos = [];

  async function carregar(){
    const { data, error } = await sb.rpc("master_lista");
    if (error) return toast(traduzErro(error));
    todos = data || [];
    desenhar();
  }
  function desenhar(){
    const q = busca.value.trim().toLowerCase();
    const vis = todos.filter(c=>!q || [c.nome,c.slug,c.email,c.instagram,c.telefone].some(x=>(x||"").toLowerCase().includes(q)));
    kpis.innerHTML = "";
    kpis.append(
      h("div",{class:"kpi"}, h("b",{text:String(todos.length)}), h("span",{text:"clientes"})),
      h("div",{class:"kpi"}, h("b",{text:String(todos.filter(c=>c.ativo).length)}), h("span",{text:"ativos"})),
      h("div",{class:"kpi"}, h("b",{text:String(todos.reduce((s,c)=>s+Number(c.visitas_30d||0),0))}), h("span",{text:"visitas 30d"})),
      h("div",{class:"kpi"}, h("b",{text:String(todos.reduce((s,c)=>s+Number(c.cliques_30d||0),0))}), h("span",{text:"cliques 30d"}))
    );
    lista.innerHTML = "";
    if (!vis.length) lista.append(h("p",{class:"hint",text:"Nenhum cliente."}));
    vis.forEach(c=>{
      const bt = h("button",{
        class:"btn peq " + (c.ativo ? "verm" : "verde"),
        text: c.ativo ? "Bloquear" : "Ativar",
        onclick: async()=>{
          if (c.ativo && !confirm(`Bloquear a página de ${c.nome || c.slug}? Ela sai do ar na hora.`)) return;
          bt.disabled = true;
          const { error } = await sb.rpc("master_set_ativo", { p_id:c.id, p_ativo:!c.ativo });
          if (error){ bt.disabled = false; return toast(traduzErro(error)); }
          c.ativo = !c.ativo; desenhar();
          toast(c.ativo ? "Página ativada." : "Página bloqueada.");
        }
      });
      lista.append(h("div",{class:"cli"},
        h("div",{class:"l1"},
          h("div",{}, h("div",{class:"nm",text:c.nome || "(sem nome)"}),
            h("a",{href:"/"+c.slug,target:"_blank",text:"/"+c.slug,style:"font-size:13px"})),
          h("span",{class:"badge "+(c.ativo?"on":"off"),text:c.ativo?"ATIVO":"BLOQUEADO"})
        ),
        h("div",{class:"meta",text:`${c.email} · desde ${dataBR(c.created_at)} · ${c.visitas_30d ?? 0} visitas · ${c.cliques_30d} cliques/30d`}),
        h("div",{class:"meta"},
          c.instagram ? h("a",{href:"https://instagram.com/"+c.instagram,target:"_blank",rel:"noopener",text:"@"+c.instagram}) : "sem Instagram",
          " · ",
          c.telefone ? h("a",{href:"https://wa.me/55"+c.telefone.replace(/\D/g,""),target:"_blank",rel:"noopener",text:c.telefone}) : "sem telefone"
        ),
        h("div",{style:"margin-top:8px;display:flex;justify-content:flex-end;gap:6px"},
          h("button",{class:"btn sec peq",text:"Ver detalhes",onclick:()=>detalheCliente(c)}), bt)
      ));
    });
  }
  busca.addEventListener("input", desenhar);

  app.append(h("div",{class:"wrap"},
    h("div",{class:"top"},
      h("h2",{text:"Painel master"}),
      h("div",{style:"display:flex;gap:6px"},
        h("button",{class:"btn sec peq",text:"Atualizar",onclick:carregar}),
        h("a",{class:"btn sec peq",href:"/admin",text:"Minha página"})
      )
    ),
    kpis,
    h("div",{class:"box"}, busca, h("div",{style:"margin-top:12px"}, lista))
  ));
  carregar();
}


/* ---------- MASTER: detalhes de um cliente (links e cliques) ---------- */
async function detalheCliente(c){
  limpar("painel");
  document.title = (c.nome || c.slug) + " — Master";
  const wrap = h("div",{class:"wrap"});
  app.append(wrap);
  wrap.append(h("div",{class:"top"},
    h("h2",{text:c.nome || c.slug}),
    h("div",{style:"display:flex;gap:6px"},
      h("a",{class:"btn sec peq",href:"/"+c.slug,target:"_blank",text:"Ver página"}),
      h("button",{class:"btn sec peq",text:"← Voltar",onclick:painelMaster})
    )
  ));
  wrap.append(h("div",{class:"meta",style:"margin-bottom:12px;color:#6b7280;font-size:13px",
    text:`${location.host}/${c.slug} · ${c.email} · ${c.ativo ? "ATIVO" : "BLOQUEADO"} · desde ${dataBR(c.created_at)}`}));
  wrap.append(h("div",{style:"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"},
    c.instagram ? h("a",{class:"btn sec peq",href:"https://instagram.com/"+c.instagram,target:"_blank",rel:"noopener",text:"Instagram @"+c.instagram}) : null,
    c.telefone ? h("a",{class:"btn verde peq",href:"https://wa.me/55"+c.telefone.replace(/\D/g,""),target:"_blank",rel:"noopener",text:"WhatsApp "+c.telefone}) : null
  ));

  const [{ data:p, error:e1 }, { data:cl, error:e2 }] = await Promise.all([
    sb.from("profiles").select(COLS_PUBLICAS).eq("id", c.id).maybeSingle(),
    sb.from("cliques").select("url,link_idx,utm_source,created_at").eq("profile_id", c.id)
      .gte("created_at", new Date(Date.now() - 90*864e5).toISOString())
      .order("created_at", { ascending:false }).limit(20000)
  ]);
  if (e1 || !p) return wrap.append(h("div",{class:"msg erro",text:"Não foi possível carregar este cliente."}));
  const cliques = e2 ? [] : (cl || []);
  const dias = n => Date.now() - n*864e5;
  const conta = (arr, n) => arr.filter(x=>new Date(x.created_at).getTime() >= dias(n)).length;
  const hoje = new Date().toDateString();

  // visitas x cliques (servidor)
  const { data:st } = await sb.rpc("stats_perfil", { p_id:c.id, p_dias:30 });
  if (st){ const bx = h("div",{class:"box"}, h("h3",{text:"Visitas e cliques (30 dias)"})); desenharStats(bx, st, { links:false }); wrap.append(bx); }

  // resumo
  wrap.append(h("div",{class:"kpis"},
    h("div",{class:"kpi"}, h("b",{text:String(cliques.filter(x=>new Date(x.created_at).toDateString()===hoje).length)}), h("span",{text:"hoje"})),
    h("div",{class:"kpi"}, h("b",{text:String(conta(cliques,7))}), h("span",{text:"7 dias"})),
    h("div",{class:"kpi"}, h("b",{text:String(conta(cliques,30))}), h("span",{text:"30 dias"})),
    h("div",{class:"kpi"}, h("b",{text:String(cliques.length)}), h("span",{text:"90 dias"}))
  ));

  // links publicados agora
  const links = Array.isArray(p.links) ? p.links : [];
  const boxL = h("div",{class:"box"}, h("h3",{text:`Links publicados agora (${links.length})`}));
  if (!links.length) boxL.append(h("p",{class:"hint",text:"Nenhum link."}));
  links.forEach(l=>{
    const n30 = cliques.filter(x=>x.url===l.url && new Date(x.created_at).getTime() >= dias(30)).length;
    boxL.append(h("div",{class:"cli"},
      h("div",{class:"l1"},
        h("div",{class:"nm",text:l.titulo || "(sem título)"}),
        h("b",{text:`${n30} cliques/30d`,style:"font-size:13px"})
      ),
      h("div",{class:"meta"}, h("a",{href:l.url,target:"_blank",rel:"noopener noreferrer",text:l.url})),
      suspeitoAposta(l.url) ? h("div",{class:"msg aviso",style:"margin-top:6px;font-size:12px",
        text:"Parece site de aposta fora do domínio .bet.br (casas autorizadas no Brasil usam .bet.br). Confira."}) : null
    ));
  });
  wrap.append(boxL);

  // cliques por destino (inclui links que já foram removidos)
  const porUrl = {};
  cliques.forEach(x=>{ porUrl[x.url] = (porUrl[x.url]||0) + 1; });
  const boxU = h("div",{class:"box"}, h("h3",{text:"Cliques por destino (90 dias)"}));
  const atuais = new Set(links.map(l=>l.url));
  const ent = Object.entries(porUrl).sort((a,b)=>b[1]-a[1]);
  if (!ent.length) boxU.append(h("p",{class:"hint",text:"Nenhum clique ainda."}));
  ent.forEach(([u,n])=> boxU.append(h("div",{class:"stat"},
    h("span",{text:(atuais.has(u) ? "" : "(removido) ") + u.replace(/^https?:\/\//,"")}), h("b",{text:String(n)}))));
  wrap.append(boxU);

  // origem (utm_source)
  const porOrigem = {};
  cliques.forEach(x=>{ const k = x.utm_source || "(sem origem)"; porOrigem[k] = (porOrigem[k]||0) + 1; });
  const boxO = h("div",{class:"box"}, h("h3",{text:"De onde vieram (utm_source)"}));
  Object.entries(porOrigem).sort((a,b)=>b[1]-a[1]).forEach(([k,n])=>
    boxO.append(h("div",{class:"stat"}, h("span",{text:k}), h("b",{text:String(n)}))));
  if (!cliques.length) boxO.append(h("p",{class:"hint",text:"—"}));
  wrap.append(boxO);

  // últimos cliques
  const boxR = h("div",{class:"box"}, h("h3",{text:"Últimos cliques"}));
  cliques.slice(0,30).forEach(x=> boxR.append(h("div",{class:"stat"},
    h("span",{text:dominioDe(x.url) + (x.utm_source ? " · " + x.utm_source : "")}),
    h("span",{style:"color:#6b7280;font-size:12px;white-space:nowrap",
      text:new Date(x.created_at).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}))));
  if (!cliques.length) boxR.append(h("p",{class:"hint",text:"—"}));
  wrap.append(boxR);
}

/* =====================================================================
   ERROS E INÍCIO
   ===================================================================== */
function erroGeral(t){
  limpar("painel");
  app.append(h("div",{class:"centro"},
    h("h2",{text:"Ops"}), h("p",{text:t}),
    h("button",{class:"btn sec",text:"Sair da conta",onclick:async()=>{ await sb.auth.signOut(); location.href="/admin"; }})
  ));
}

function iniciar(){
  if (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && !window.supabase){
    limpar("painel");
    app.append(h("div",{class:"centro"},
      h("h2",{text:"Não carregou"}),
      h("p",{text:"Sua internet oscilou. Toque para tentar de novo."}),
      h("button",{class:"btn",text:"Tentar de novo",onclick:()=>location.reload()})
    ));
    return;
  }
  if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY){
    limpar("painel");
    app.append(h("div",{class:"centro"},
      h("h2",{text:"Configuração pendente"}),
      h("p",{text:"Preencha SUPABASE_URL e SUPABASE_ANON_KEY no arquivo config.js."})
    ));
    return;
  }
  CFG.SUPABASE_URL = CFG.SUPABASE_URL.trim().replace(/\/rest\/v1\/?$/,"").replace(/\/+$/,"");
  CFG.SUPABASE_ANON_KEY = CFG.SUPABASE_ANON_KEY.trim();
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);

  let recuperando = false;
  sb.auth.onAuthStateChange((evento)=>{
    if (evento === "PASSWORD_RECOVERY"){ recuperando = true; telaNovaSenha(); }
  });

  const seg = (location.pathname.split("/")[1] || "").toLowerCase();
  const rotear = ()=>{
    if (recuperando) return;
    if (seg === "") return paginaInicial();
    if (seg === "admin") return painelCliente();
    if (seg === "master") return painelMaster();
    if (seg === "termos") return paginaTermos();
    return paginaPublica(decodeURIComponent(seg));
  };
  // dá tempo do Supabase ler o link de confirmação/recuperação vindo do e-mail
  if (/access_token|type=recovery|code=/.test(location.hash + location.search)) setTimeout(rotear, 600);
  else rotear();
}
iniciar();
</script>
